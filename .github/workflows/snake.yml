# Generates the contribution snake animation and publishes it to the `output` branch.
# The profile README pulls the SVGs from raw.githubusercontent.com/joaodev02/joaodev02/output/...
name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC (midnight in Ribeirão Preto)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Light + dark variants, snake tinted red (#EF4444) to match the profile theme.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#EF4444
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EF4444

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
